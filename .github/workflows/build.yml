name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer
          java -version
      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/licenses
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55a071c7e15c9300f0e3e" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c4501b8fb177b" >> $ANDROID_HOME/licenses/android-sdk-license
          buildozer android debug || true
          SDKMGR=$(find $HOME/.buildozer -name sdkmanager -type f | head -1)
          echo "Found sdkmanager at $SDKMGR"
          chmod +x $SDKMGR
          yes | $SDKMGR --licenses || true
          yes | $SDKMGR "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "platform-tools" || true
          ls $ANDROID_HOME/build-tools/
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daak-apk
          path: bin/*.apk
